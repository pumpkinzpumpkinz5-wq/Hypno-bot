<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypp</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="panel">
  <fieldset>
    <legend>Main audio</legend>
    <input type="file" id="audioFile" accept="audio/*,video/*">
    <input type="text" id="audioUrl" placeholder="...or paste audio URL">
    <label class="row">Start at <input type="text" id="startAt" placeholder="0:00" style="width: 80px"></label>
  </fieldset>

  <fieldset>
    <legend>Overlay audio</legend>
    <div id="overlays"></div>
    <button id="addOverlay">+ Add overlay</button>
  </fieldset>

  <fieldset id="imageBox">
    <legend>Picture / GIF</legend>
    <input type="file" id="imageFile" accept="image/*">
    <input type="text" id="imageUrl" placeholder="...or paste image/GIF URL">
  </fieldset>

  <button id="loadBtn">Load</button>

  <fieldset id="spiralBox">
    <legend>Hypno spiral</legend>
    <label class="row">Enabled <input type="checkbox" id="spiralOn"></label>
    <label class="row">Pattern
      <select id="spiralPattern">
        <option value="spiral">Spiral</option>
        <option value="tight">Tight spiral</option>
        <option value="many">Many arms</option>
        <option value="sunburst">Sunburst</option>
        <option value="custom">Custom image</option>
      </select>
    </label>
    <div id="customSpiral" hidden>
      <input type="file" id="spiralFile" accept="image/*">
      <input type="text" id="spiralUrl" placeholder="...or paste spiral image/GIF URL">
    </div>
    <label class="row">Opacity <input type="range" id="spiralOpacity" min="0" max="1" step="0.01" value="0.5"></label>
    <label class="row">Speed <input type="range" id="spiralSpeed" min="-6" max="6" step="0.1" value="1.5"></label>
    <label class="row">Color <input type="color" id="spiralColor" value="#ffffff"></label>
  </fieldset>

  <div class="buttons">
    <button id="exportBtn">Export video</button>
  </div>
  <div id="status"></div>
  <div class="hint">Drag and drop files anywhere. Use Chrome or Edge. Keep this tab visible while exporting.</div>
</div>

<div class="stage">
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div class="seek">
    <button id="playBtn">Play</button>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0">
    <span id="timeLabel">0:00 / 0:00</span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
