<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypp</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  .panel { width: 320px; display: flex; flex-direction: column; gap: 14px; }
  fieldset { border: 1px solid #333; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  legend { padding: 0 4px; color: #aaa; }
  select { padding: 4px; background: #1c1c1c; color: #ddd; border: 1px solid #333; border-radius: 4px; }
  input[type=text] { width: 100%; padding: 6px; background: #1c1c1c; color: #ddd; border: 1px solid #333; border-radius: 4px; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  button { padding: 8px 12px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; cursor: pointer; }
  button:hover { background: #333; }
  button:disabled { opacity: .5; cursor: default; }
  .buttons { display: flex; gap: 8px; }
  .buttons button { flex: 1; }
  #status { min-height: 1.4em; color: #9c9; white-space: pre-wrap; }
  #status.error { color: #e88; }
  .stage { flex: 1; min-width: 320px; }
  canvas { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; display: block; }
  .hint { color: #777; font-size: 12px; }
  .seek { max-width: 1280px; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .seek input { flex: 1; }
  #playBtn { width: 72px; }
  #timeLabel { font-variant-numeric: tabular-nums; color: #aaa; }
  .overlay { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid #2a2a2a; }
  .overlay .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .overlay button { padding: 2px 8px; }
  body.dragging fieldset { border-style: dashed; border-color: #666; }
</style>
</head>
<body>
<div class="panel">
  <fieldset>
    <legend>Main audio</legend>
    <input type="file" id="audioFile" accept="audio/*,video/*">
    <input type="text" id="audioUrl" placeholder="...or paste audio URL">
    <label class="row">Start at <input type="text" id="startAt" placeholder="0:00" style="width: 80px"></label>
  </fieldset>

  <fieldset>
    <legend>Overlay audio</legend>
    <div id="overlays"></div>
    <button id="addOverlay">+ Add overlay</button>
  </fieldset>

  <fieldset id="imageBox">
    <legend>Picture / GIF</legend>
    <input type="file" id="imageFile" accept="image/*">
    <input type="text" id="imageUrl" placeholder="...or paste image/GIF URL">
  </fieldset>

  <button id="loadBtn">Load</button>

  <fieldset id="spiralBox">
    <legend>Hypno spiral</legend>
    <label class="row">Enabled <input type="checkbox" id="spiralOn"></label>
    <label class="row">Pattern
      <select id="spiralPattern">
        <option value="spiral">Spiral</option>
        <option value="tight">Tight spiral</option>
        <option value="many">Many arms</option>
        <option value="sunburst">Sunburst</option>
        <option value="custom">Custom image</option>
      </select>
    </label>
    <div id="customSpiral" hidden>
      <input type="file" id="spiralFile" accept="image/*">
      <input type="text" id="spiralUrl" placeholder="...or paste spiral image/GIF URL">
    </div>
    <label class="row">Opacity <input type="range" id="spiralOpacity" min="0" max="1" step="0.01" value="0.5"></label>
    <label class="row">Speed <input type="range" id="spiralSpeed" min="-6" max="6" step="0.1" value="1.5"></label>
    <label class="row">Color <input type="color" id="spiralColor" value="#ffffff"></label>
  </fieldset>

  <div class="buttons">
    <button id="exportBtn">Export video</button>
  </div>
  <div id="status"></div>
  <div class="hint">Drag and drop files anywhere. Use Chrome or Edge. Keep this tab visible while exporting.</div>
</div>

<div class="stage">
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div class="seek">
    <button id="playBtn">Play</button>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0">
    <span id="timeLabel">0:00 / 0:00</span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const audio = new Audio();
const statusEl = $('status');

let audioCtx, audioDest;
let picture = { frames: [], totalDur: 0 };
let customSpiral = { frames: [], totalDur: 0 };
let spiralImg = null;
let spiralAngle = 0;
let recorder = null;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

// Order: picked file, then saved/previously loaded blob, then URL.
// URLs are fetched to a blob so the canvas never gets tainted (needed for export).
async function getSlot(fileInput, urlInput) {
  const file = fileInput.files[0];
  if (file) return fileInput.saved = { blob: file, name: file.name };
  if (fileInput.saved) return fileInput.saved;
  const url = urlInput.value.trim();
  if (!url) return null;
  let res;
  try {
    res = await fetch(url);
  } catch {
    throw new Error(`Could not load ${url}\nThe site probably blocks direct access. Download the file and pick it with the file button instead.`);
  }
  if (!res.ok) throw new Error(`Could not load ${url} (HTTP ${res.status})`);
  return fileInput.saved = { blob: await res.blob(), name: url.split('/').pop().split('?')[0] || url };
}

// A new file or URL replaces whatever was saved for that slot
function wireSlot(fileInput, urlInput) {
  fileInput.addEventListener('change', () => fileInput.saved = null);
  urlInput.addEventListener('input', () => { fileInput.saved = null; fileInput.value = ''; });
}
wireSlot($('audioFile'), $('audioUrl'));
wireSlot($('imageFile'), $('imageUrl'));
wireSlot($('spiralFile'), $('spiralUrl'));

function addOverlayRow(saved) {
  const row = document.createElement('div');
  row.className = 'overlay';
  row.innerHTML = `<div class="row"><input type="file" accept="audio/*,video/*"><button title="Remove">✕</button></div>
    <input type="text" placeholder="...or paste audio URL">`;
  const [fileInput, urlInput] = row.querySelectorAll('input');
  wireSlot(fileInput, urlInput);
  if (saved) {
    fileInput.saved = saved;
    urlInput.value = saved.url || '';
  }
  row.querySelector('button').onclick = () => { row.remove(); loadAll(); };
  $('overlays').append(row);
  return row;
}
$('addOverlay').onclick = () => addOverlayRow();

// Tiny IndexedDB key/value store for the loaded files
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('hypp', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const tx = req.result.transaction('kv', mode);
      const r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(r.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}

// Returns { frames: [{ bmp, dur }], totalDur } — one frame for still images
async function decodeImage(blob) {
  const frames = [];
  let totalDur = 0;

  const isGif = blob.type === 'image/gif' || (await blob.slice(0, 3).text()) === 'GIF';
  if (isGif && 'ImageDecoder' in window) {
    const decoder = new ImageDecoder({ data: await blob.arrayBuffer(), type: 'image/gif' });
    await decoder.tracks.ready;
    await decoder.completed;
    const count = decoder.tracks.selectedTrack.frameCount;
    for (let i = 0; i < count; i++) {
      const { image } = await decoder.decode({ frameIndex: i });
      // Browsers treat 0/tiny GIF delays as ~100ms
      const dur = image.duration && image.duration > 10000 ? image.duration / 1000 : 100;
      frames.push({ bmp: await createImageBitmap(image), dur });
      image.close();
      totalDur += dur;
    }
    decoder.close();
  } else {
    frames.push({ bmp: await createImageBitmap(blob), dur: 0 });
  }
  return { frames, totalDur };
}

let mainBlob, imageBlob, spiralBlob;
let overlayBufs = [];
let overlayNodes = [];
const decoded = new WeakMap();

async function decodeOverlay(blob) {
  if (!decoded.has(blob)) decoded.set(blob, await audioCtx.decodeAudioData(await blob.arrayBuffer()));
  return decoded.get(blob);
}

async function loadAll(verb = 'Loaded') {
  setStatus('Loading...');
  try {
    ensureAudioGraph();
    const main = await getSlot($('audioFile'), $('audioUrl'));
    const image = await getSlot($('imageFile'), $('imageUrl'));
    const spiral = await getSlot($('spiralFile'), $('spiralUrl'));
    const overlays = [];
    for (const row of $('overlays').children) {
      const [fileInput, urlInput] = row.querySelectorAll('input');
      const o = await getSlot(fileInput, urlInput);
      if (o) overlays.push({ ...o, url: urlInput.value.trim() });
    }

    // Only swap what changed, so removing an overlay doesn't restart the main track
    if (main && main.blob !== mainBlob) {
      mainBlob = main.blob;
      if (audio.src) URL.revokeObjectURL(audio.src);
      audio.src = URL.createObjectURL(mainBlob);
    }
    if (image && image.blob !== imageBlob) {
      imageBlob = image.blob;
      picture.frames.forEach(f => f.bmp.close());
      picture = await decodeImage(imageBlob);
    }
    if (spiral && spiral.blob !== spiralBlob) {
      spiralBlob = spiral.blob;
      customSpiral.frames.forEach(f => f.bmp.close());
      customSpiral = await decodeImage(spiralBlob);
    }
    overlayBufs = await Promise.all(overlays.map(o => decodeOverlay(o.blob)));
    startOverlays();

    idb('readwrite', s => s.put({ main, image, spiral, overlays }, 'session')).catch(() => {});
    const names = [main, image, spiral, ...overlays].filter(Boolean).map(s => s.name);
    setStatus(names.length ? `${verb}: ${names.join(', ')}` : '');
  } catch (e) {
    setStatus(e.message, true);
  }
}
$('loadBtn').onclick = () => loadAll();

// Accepts "90", "1:30" or "1:02:30"
function startTime() {
  return $('startAt').value.trim().split(':').reduce((acc, p) => acc * 60 + (+p || 0), 0);
}

let mix;
function ensureAudioGraph() {
  if (audioCtx) return;
  audioCtx = new AudioContext();
  audioDest = audioCtx.createMediaStreamDestination();
  mix = audioCtx.createGain();
  mix.connect(audioCtx.destination);
  mix.connect(audioDest);
  audioCtx.createMediaElementSource(audio).connect(mix);
}

// Overlays follow the main track's clock: looped, restarted on play/seek, stopped on pause/end
function stopOverlays() {
  overlayNodes.forEach(n => n.stop());
  overlayNodes = [];
}
function startOverlays() {
  stopOverlays();
  if (!audioCtx || audio.paused) return;
  for (const buf of overlayBufs) {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(mix);
    src.start(0, audio.currentTime % buf.duration);
    overlayNodes.push(src);
  }
}
audio.addEventListener('playing', startOverlays);
audio.addEventListener('seeked', startOverlays);
audio.addEventListener('seeking', stopOverlays);
audio.addEventListener('pause', stopOverlays);
audio.addEventListener('ended', stopOverlays);

$('playBtn').onclick = async () => {
  if (!audio.src) return setStatus('Load an audio file first.', true);
  ensureAudioGraph();
  await audioCtx.resume();
  if (audio.paused) {
    if (audio.currentTime < startTime() || audio.ended) audio.currentTime = startTime();
    await audio.play();
  } else audio.pause();
};
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function updateSeek() {
  const d = audio.duration || 0;
  $('seek').max = d;
  $('seek').value = audio.currentTime;
  $('timeLabel').textContent = `${fmt(audio.currentTime)} / ${fmt(d)}`;
}
audio.addEventListener('loadedmetadata', updateSeek);
audio.addEventListener('timeupdate', updateSeek);
$('seek').oninput = () => {
  audio.currentTime = +$('seek').value;
  updateSeek();
};

// Space toggles play unless typing. Blocking keyup too stops a focused button from also "clicking".
const isTyping = e => e.target.matches('input[type=text]');
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || isTyping(e)) return;
  e.preventDefault();
  if (!e.repeat && !$('playBtn').disabled) $('playBtn').click();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && !isTyping(e)) e.preventDefault();
});

audio.onplay = () => $('playBtn').textContent = 'Pause';
audio.onpause = () => $('playBtn').textContent = 'Play';

// Pre-render the spiral once; each frame just rotates it.
function buildSpiral() {
  const size = Math.ceil(Math.hypot(canvas.width, canvas.height));
  const off = new OffscreenCanvas(size, size);
  const octx = off.getContext('2d');
  const img = octx.createImageData(size, size);
  const hex = $('spiralColor').value;
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  // Log spirals: arms keep the same angle at every radius, so they read as spirals instead of rings
  const [arms, twist] = { spiral: [4, 3], tight: [6, 5], many: [8, 2], sunburst: [16, 0] }[$('spiralPattern').value] || [4, 3];
  const c = size / 2;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = x - c, dy = y - c;
      const phase = (Math.atan2(dy, dx) / (2 * Math.PI)) * arms + Math.log(Math.hypot(dx, dy) + 1) * twist;
      if (((phase % 1) + 1) % 1 < 0.5) {
        const i = (y * size + x) * 4;
        img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
      }
    }
  }
  octx.putImageData(img, 0, 0);
  spiralImg = off;
}
$('spiralColor').oninput = buildSpiral;
$('spiralPattern').onchange = () => {
  $('customSpiral').hidden = $('spiralPattern').value !== 'custom';
  buildSpiral();
};
buildSpiral();

function currentFrame({ frames, totalDur }, now) {
  if (frames.length <= 1) return frames[0]?.bmp;
  let t = now % totalDur;
  for (const f of frames) {
    if (t < f.dur) return f.bmp;
    t -= f.dur;
  }
  return frames[frames.length - 1].bmp;
}

let last = performance.now();
function render(now) {
  const dt = (now - last) / 1000;
  last = now;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const bmp = currentFrame(picture, now);
  if (bmp) {
    const s = Math.min(W / bmp.width, H / bmp.height);
    const w = bmp.width * s, h = bmp.height * s;
    ctx.drawImage(bmp, (W - w) / 2, (H - h) / 2, w, h);
  }

  if ($('spiralOn').checked) {
    spiralAngle += dt * +$('spiralSpeed').value;
    ctx.save();
    ctx.globalAlpha = +$('spiralOpacity').value;
    ctx.translate(W / 2, H / 2);
    ctx.rotate(spiralAngle);
    if ($('spiralPattern').value === 'custom') {
      const sp = currentFrame(customSpiral, now);
      if (sp) {
        // Cover the whole frame while rotating; "screen" makes black see-through
        const s = Math.hypot(W, H) / Math.min(sp.width, sp.height);
        const w = sp.width * s, h = sp.height * s;
        ctx.globalCompositeOperation = 'screen';
        ctx.drawImage(sp, -w / 2, -h / 2, w, h);
      }
    } else {
      ctx.drawImage(spiralImg, -spiralImg.width / 2, -spiralImg.height / 2);
    }
    ctx.restore();
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function pickMime() {
  return ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m));
}

$('exportBtn').onclick = async () => {
  if (recorder) return recorder.stop();
  if (!audio.src) return setStatus('Load an audio file first.', true);
  ensureAudioGraph();
  await audioCtx.resume();

  const mime = pickMime();
  const stream = new MediaStream([
    ...canvas.captureStream(30).getVideoTracks(),
    ...audioDest.stream.getAudioTracks(),
  ]);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5_000_000 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    audio.pause();
    audio.ontimeupdate = null;
    audio.onended = null;
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime }));
    a.download = `hypp.${ext}`;
    a.click();
    recorder = null;
    $('exportBtn').textContent = 'Export video';
    $('playBtn').disabled = $('seek').disabled = false;
    setStatus(`Exported hypp.${ext}`);
  };

  audio.pause();
  const start = startTime();
  audio.currentTime = start;
  audio.onended = () => recorder?.stop();
  audio.ontimeupdate = () => {
    if (audio.duration) setStatus(`Exporting... ${Math.floor((audio.currentTime - start) / (audio.duration - start) * 100)}%`);
  };
  $('exportBtn').textContent = 'Stop export';
  $('playBtn').disabled = $('seek').disabled = true;
  recorder.start(1000);
  await audio.play();
};

// Drag & drop: onto a box/row targets it; elsewhere images go to the picture, audio to main (if empty) or a new overlay
function setFile(fileInput, file) {
  const dt = new DataTransfer();
  dt.items.add(file);
  fileInput.files = dt.files;
  fileInput.saved = null;
}
let dragDepth = 0;
document.addEventListener('dragenter', () => document.body.classList.toggle('dragging', ++dragDepth > 0));
document.addEventListener('dragleave', () => document.body.classList.toggle('dragging', --dragDepth > 0));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const target = e.target.closest('#overlays .overlay, fieldset');
  [...e.dataTransfer.files].forEach((file, i) => {
    const isImage = file.type.startsWith('image/');
    if (i === 0 && target?.classList.contains('overlay')) setFile(target.querySelector('input[type=file]'), file);
    else if (i === 0 && target?.contains($('audioFile')) && !isImage) setFile($('audioFile'), file);
    else if (i === 0 && target?.id === 'spiralBox' && isImage) {
      setFile($('spiralFile'), file);
      $('spiralPattern').value = 'custom';
      $('spiralPattern').dispatchEvent(new Event('change'));
      $('spiralPattern').dispatchEvent(new Event('input', { bubbles: true }));
    }
    else if (isImage) setFile($('imageFile'), file);
    else if (!mainBlob && !$('audioFile').files[0] && !(i === 0 && target?.contains($('addOverlay')))) setFile($('audioFile'), file);
    else setFile(addOverlayRow().querySelector('input[type=file]'), file);
  });
  loadAll();
});

// Remember text fields and spiral settings
const savedFields = ['audioUrl', 'imageUrl', 'spiralUrl', 'spiralPattern', 'startAt', 'spiralOn', 'spiralOpacity', 'spiralSpeed', 'spiralColor'];
try {
  const saved = JSON.parse(localStorage.getItem('hypp') || '{}');
  for (const id of savedFields) {
    if (!(id in saved)) continue;
    if ($(id).type === 'checkbox') $(id).checked = saved[id]; else $(id).value = saved[id];
  }
  $('spiralPattern').onchange();
} catch {}
document.addEventListener('input', () => {
  try {
    localStorage.setItem('hypp', JSON.stringify(Object.fromEntries(
      savedFields.map(id => [id, $(id).type === 'checkbox' ? $(id).checked : $(id).value]))));
  } catch {}
});

// Restore last loaded files
idb('readonly', s => s.get('session')).then(session => {
  if (!session) return;
  $('audioFile').saved = session.main;
  $('imageFile').saved = session.image;
  $('spiralFile').saved = session.spiral;
  session.overlays.forEach(addOverlayRow);
  loadAll('Restored');
}).catch(() => {});
</script>
</body>
</html>
